<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ti Machann — Achte fasil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🛒 Ti Machann</h1>
    <p>Chwazi pwodwi w, nou voye kòmand lan bay machann lan</p>
  </header>

  <main>
    <section class="pwodwi-yo" id="lisPwodwi">
      <!-- Pwodwi yo ap parèt isit la ak JavaScript -->
    </section>

    <section class="fòm-kòmand">
      <h2>Kòmand ou</h2>
      <div id="rezimeKòmand">
        <p><em>Pa gen anyen nan kòmand ou poko.</em></p>
      </div>

      <input type="text" id="nonKliyan" placeholder="Non w">
      <input type="tel" id="telKliyan" placeholder="Telefòn ou">
      <input type="text" id="adrèsKliyan" placeholder="Adrès livrezon">

      <button onclick="voyeKòmand()">Voye kòmand sou WhatsApp</button>
    </section>
  </main>

  <footer>
    <p>© 2025 Ti Machann — Fèt ak ❤️ pou Ayiti</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
